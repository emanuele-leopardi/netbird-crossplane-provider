apiVersion: netbird.m.crossplane.io/v1alpha1
kind: NbPolicy
metadata:
  namespace: default
  name: xplanepolicytest2
spec:
  providerConfigRef:
    name: default
    kind: ClusterProviderConfig
  forProvider:
    description: test policy2
    enabled: true
    name: xplanepolicytest2
